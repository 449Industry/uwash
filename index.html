<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유워시 매출결산</title>
<style>
:root{--border:#b9b9b9;--bg:#f4f4f4;--panel:#fff;--text:#111;--muted:#666;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
button{font:inherit;cursor:pointer} .hidden{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:min(380px,100%);background:#fff;border:1px solid #ccc;padding:28px;box-shadow:0 8px 30px #0001}
.login-card h1{margin:0 0 18px;font-size:24px} .login-card input{width:100%;font-size:22px;padding:12px;border:1px solid #aaa}
.login-card button{width:100%;margin-top:12px;padding:12px;font-weight:700} #loginError{color:#b00020;min-height:24px;margin-top:8px}
.app{max-width:1180px;margin:0 auto;padding:18px} header{display:flex;align-items:center;gap:14px;margin-bottom:14px}
header h1{font-size:24px;margin:0} .spacer{flex:1} .updated{color:var(--muted);font-size:13px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px} .month-title{font-size:24px;font-weight:700;min-width:170px;text-align:center}
.month-total{margin-left:auto;font-weight:700} .panel{background:var(--panel);border:1px solid #ccc;padding:12px}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px} .weekdays div{text-align:center;font-weight:700;padding:7px}
.calendar{grid-template-rows:repeat(6,104px)} .day{position:relative;display:block;border:1px solid #c8c8c8;background:#fff;padding:7px;text-align:left;overflow:hidden;vertical-align:top}
.day.empty{background:#eee;cursor:default} .day .n{position:absolute;top:7px;left:7px;font-weight:400;font-size:17px;line-height:1} .day .amount{font-size:15px;font-weight:400;line-height:1.45;margin-top:25px} .day .sales-line{font-size:17px;font-weight:700} .day.holiday .n,.day.saturday .n{color:#c00000}
.day.has-data:hover{outline:2px solid #555} .pending{color:#b00020;font-weight:700}
.detail-toolbar{display:flex;gap:8px;margin-bottom:12px} .detail-box{background:#fff;border:1px solid #222}
.summary{width:100%;border-collapse:collapse} .summary th,.summary td{border:1px solid #222;padding:14px 16px;font-size:18px}
.summary .title th{font-size:27px;text-align:left;padding:18px} .summary .head th{text-align:center;font-weight:400}
.summary .total td{font-size:22px;font-weight:700} .summary td:last-child{text-align:right}
.manual-title{font-size:20px;margin:24px 0 8px} .manual{width:100%;border-collapse:collapse;background:#fff}
.manual th,.manual td{border:1px solid #777;padding:10px;font-size:14px} .manual th{background:#eee} .manual td:nth-child(-n+4){text-align:center}
@page{size:A4 portrait;margin:15mm} @media print{body{background:#fff} header,.toolbar,.detail-toolbar,#calendarView{display:none!important} .app{max-width:none;padding:0} #detailView{display:block!important} .detail-box{border:none} .summary .title th{font-size:24px}}
@media(max-width:760px){.app{padding:8px} .calendar{grid-template-rows:repeat(6,88px)} .day{padding:4px} .day .n{top:4px;left:4px} .day .amount{font-size:11px;margin-top:21px} .month-total{display:none} .summary th,.summary td{font-size:15px;padding:10px}}
</style>
</head>
<body>
<section id="login"><div class="login-card"><h1>유워시 매출결산</h1><input id="pw" type="password" inputmode="numeric" maxlength="8" placeholder="비밀번호" autofocus><button id="loginBtn">확인</button><div id="loginError"></div></div></section>
<main id="app" class="app hidden">
<header><h1>유워시 매출결산</h1><div class="spacer"></div><div class="updated" id="updated"></div><button id="logout">로그아웃</button></header>
<section id="calendarView">
<div class="toolbar"><button id="prevMonth">◀</button><div class="month-title" id="monthTitle"></div><button id="nextMonth">▶</button><button id="thisMonth">이번 달</button><div class="month-total" id="monthTotal"></div></div>
<div class="panel"><div class="weekdays"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div class="calendar" id="calendar"></div></div>
</section>
<section id="detailView" class="hidden">
<div class="detail-toolbar"><button id="back">달력으로</button><button id="prevDay">◀ 이전 날짜</button><button id="nextDay">다음 날짜 ▶</button><div class="spacer"></div><button id="print">인쇄</button></div>
<div class="detail-box"><table class="summary"><tr class="title"><th colspan="2" id="detailTitle"></th></tr><tr class="head"><th>구분</th><th>금액</th></tr><tr class="total"><td>총매출</td><td id="detailTotal"></td></tr><tr><td>현금(충전무인)</td><td id="detailCash"></td></tr><tr><td>카드</td><td id="detailCard"></td></tr></table></div>
<div id="manualWrap" class="hidden"><h2 class="manual-title">충전(수동) 내역</h2><table class="manual"><thead><tr><th>시간</th><th>금액</th><th>처리</th><th>결제수단</th><th>코멘트</th></tr></thead><tbody id="manualBody"></tbody></table></div>
</section>
</main>
<script id="sales-data" type="application/json">{"generated_at": "2026-07-30T17:09:22", "days": {"2026-07-29": {"date": "2026-07-29", "unattended": 210000, "manual_cash": 0, "manual_account": 0, "manual_card": 0, "card_file": 270000, "card_count": 18, "pending": 0, "cash": 210000, "card": 270000, "total": 480000, "manual": []}}, "holidays": ["2026-01-01", "2026-02-16", "2026-02-17", "2026-02-18", "2026-03-01", "2026-03-02", "2026-05-05", "2026-05-24", "2026-05-25", "2026-06-03", "2026-06-06", "2026-07-17", "2026-08-15", "2026-08-17", "2026-09-24", "2026-09-25", "2026-09-26", "2026-10-03", "2026-10-05", "2026-10-09", "2026-12-25"]}</script>
<script>
const DATA=JSON.parse(document.getElementById('sales-data').textContent);const DAYS=DATA.days;const HOLIDAYS=new Set(DATA.holidays||[]);const PW_HASH='6e1bd58295f37962db4f0f1631f73a7ab96ca4df95a993af8b3a0f94523ef2f8';
const $=id=>document.getElementById(id); const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
let now=new Date(), year=now.getFullYear(), month=now.getMonth(), selected=null;
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){if(await hash($('pw').value)===PW_HASH){sessionStorage.setItem('uwash_auth','1');$('login').classList.add('hidden');$('app').classList.remove('hidden');renderCalendar()}else $('loginError').textContent='비밀번호가 맞지 않습니다.'}
function boot(){$('updated').textContent='업데이트: '+DATA.generated_at.replace('T',' ');if(sessionStorage.getItem('uwash_auth')==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');renderCalendar()}}
function key(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function renderCalendar(){$('monthTitle').textContent=`${year}년 ${month+1}월`;const first=(new Date(year,month,1).getDay()+6)%7;const count=new Date(year,month+1,0).getDate();let html='';let mt=0,mc=0,mk=0;for(let i=0;i<42;i++){const d=i-first+1;if(d<1||d>count){html+='<button class="day empty" disabled></button>';continue}const k=key(year,month,d),r=DAYS[k];const dow=new Date(k+'T00:00:00').getDay();const cls=(HOLIDAYS.has(k)||dow===0)?' holiday':(dow===6?' saturday':'');if(r){mt+=r.total;mc+=r.cash;mk+=r.card;html+=`<button class="day has-data${cls}" data-date="${k}"><div class="n">${d}</div><div class="amount"><span class="sales-line">매출 ${r.total.toLocaleString()}</span><br>현금 ${r.cash.toLocaleString()}<br>카드 ${r.card.toLocaleString()}${r.pending?`<br><span class="pending">미확인 ${r.pending}건</span>`:''}</div></button>`}else html+=`<button class="day${cls}" data-date="${k}"><div class="n">${d}</div></button>`}$('calendar').innerHTML=html;$('monthTotal').textContent=`월매출 ${mt.toLocaleString()}원 | 현금 ${mc.toLocaleString()} 카드 ${mk.toLocaleString()}`;document.querySelectorAll('.day[data-date]').forEach(b=>b.onclick=()=>showDetail(b.dataset.date))}
function showDetail(k){selected=k;const r=DAYS[k]||{total:0,cash:0,card:0,manual:[]};const dt=new Date(k+'T00:00:00'),wd=['일','월','화','수','목','금','토'][dt.getDay()];$('detailTitle').textContent=`${k}(${wd}) 유워시 매출 내역`;$('detailTotal').textContent=won(r.total);$('detailCash').textContent=won(r.cash);$('detailCard').textContent=won(r.card);const list=r.manual||[];$('manualWrap').classList.toggle('hidden',list.length===0);$('manualBody').innerHTML=list.map(x=>`<tr><td>${x.time}</td><td>${won(x.amount)}</td><td>${({pending:'미확인',record:'기록',ignore:'무시'})[x.decision]||x.decision}</td><td>${x.method||''}</td><td>${escapeHtml(x.comment||'')}</td></tr>`).join('');$('calendarView').classList.add('hidden');$('detailView').classList.remove('hidden')}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function moveDay(delta){if(!selected)return;const d=new Date(selected+'T00:00:00');d.setDate(d.getDate()+delta);showDetail(key(d.getFullYear(),d.getMonth(),d.getDate()))}
$('loginBtn').onclick=login;$('pw').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>{sessionStorage.removeItem('uwash_auth');location.reload()};
$('prevMonth').onclick=()=>{month--;if(month<0){month=11;year--}renderCalendar()};$('nextMonth').onclick=()=>{month++;if(month>11){month=0;year++}renderCalendar()};$('thisMonth').onclick=()=>{const d=new Date();year=d.getFullYear();month=d.getMonth();renderCalendar()};
$('back').onclick=()=>{$('detailView').classList.add('hidden');$('calendarView').classList.remove('hidden')};$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);$('print').onclick=()=>window.print();boot();
</script></body></html>
