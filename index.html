  const manual=await apiFetch(q);
  const daily=await apiFetch('uwash_daily_sales?select=*&sale_date=eq.'+encodeURIComponent(dateKey));
  if(!daily.length)return;
  let mc=0,ma=0,mcard=0,pending=0;
  for(const r of manual){
    if(r.decision==='pending')pending++;
    if(r.decision!=='record')continue;
    const value=num(r.sales_amount);
    if(r.payment_method==='현금')mc+=value;
    else if(r.payment_method==='계좌')ma+=value;
    else if(r.payment_method==='카드')mcard+=value;
  }
  const d=daily[0],cash=num(d.unattended_cash)+mc+ma,card=num(d.card_sales)+mcard;
  await apiWrite('PATCH','uwash_daily_sales?sale_date=eq.'+encodeURIComponent(dateKey),{
    manual_cash:mc,manual_account:ma,manual_card:mcard,pending_count:pending,
    cash_total:cash,card_total:card,total_sales:cash+card,
    local_updated_at:new Date().toISOString()
  });
}
function openManualEdit(key){
  if(session?.role!=='admin')return;
  const row=manualRows.find(x=>x.transaction_key===key);if(!row)return;
  editingKey=key;
  $('editMeta').textContent=`${row.sale_date} ${row.event_time||''} · 카드 ${row.card_no||'-'} · 충전 ${won(row.charge_amount)}`;
  $('editDecision').value=row.decision||'pending';
  $('editSalesAmount').value=row.sales_amount==null?'':String(row.sales_amount);
  $('editMethod').value=row.payment_method||'';
  $('editComment').value=row.comment||'';
  $('editError').textContent='';
  $('editModal').classList.remove('hidden');
}
function closeManualEdit(){editingKey=null;$('editModal').classList.add('hidden')}
async function saveManualEdit(){
  const row=manualRows.find(x=>x.transaction_key===editingKey);if(!row)return;
  const decision=$('editDecision').value,method=$('editMethod').value,comment=$('editComment').value.trim();
  const raw=$('editSalesAmount').value.replace(/[,원\s]/g,'');
  let sales=null;
  if(decision==='record'){
    if(!['현금','계좌','카드'].includes(method)){$('editError').textContent='기록할 때는 결제수단을 선택하세요.';return}
    if(!/^\d+$/.test(raw)){$('editError').textContent='실제 수납금액을 숫자로 입력하세요.';return}
    sales=Number(raw);
  }
  if(decision==='ignore'&&!comment){$('editError').textContent='무시할 때는 코멘트에 사유를 입력하세요.';return}
  const body={
    decision,
    payment_method:decision==='record'?method:null,
    sales_amount:decision==='record'?sales:null,
    comment,
    local_updated_at:new Date().toISOString()
  };
  $('saveEdit').disabled=true;$('editError').textContent='저장 중...';
  try{
    await apiWrite('PATCH','uwash_manual_charge?transaction_key=eq.'+encodeURIComponent(editingKey),body);
    await recalcDaily(row.sale_date);
    closeManualEdit();
    await loadData();
    showDetail(row.sale_date);
    setStatus('웹 수정값을 Supabase DB에 저장했습니다. PC는 다음 양방향 동기화 때 가져옵니다.');
  }catch(e){$('editError').textContent='저장 실패: '+e.message}
  finally{$('saveEdit').disabled=false}
}
async function fetchAll(table,select,order){const all=[],limit=1000;for(let offset=0;;offset+=limit){const p=new URLSearchParams({select,order,limit:String(limit),offset:String(offset)});const rows=await apiFetch(table+'?'+p.toString());all.push(...rows);if(rows.length<limit)break}return all}
async function loadData(){setStatus('Supabase DB에서 매출 데이터를 불러오는 중...');$('refreshBtn').disabled=true;try{const [d,m]=await Promise.all([fetchAll('uwash_daily_sales','*','sale_date.asc'),fetchAll('uwash_manual_charge','transaction_key,sale_date,event_time,charge_amount,sales_amount,card_no,machine,decision,payment_method,comment,local_updated_at,synced_at','sale_date.asc,event_time.asc')]);dailyRows=d;manualRows=m;days={};manualByDate={};for(const r of d)days[r.sale_date]=r;for(const r of m)(manualByDate[r.sale_date]??=[]).push(r);lastLoadAt=Date.now();const synced=d.map(x=>x.synced_at).filter(Boolean).sort().at(-1)||'-';setStatus(`DB 연결됨 · 일매출 ${d.length.toLocaleString()}일 · 수동충전 ${m.length.toLocaleString()}건 · 서버 최근동기화 ${String(synced).replace('T',' ').slice(0,19)}`);renderMonth();renderYear();if(selected&&!$('detailView').classList.contains('hidden'))showDetail(selected)}catch(e){setStatus('DB 조회 실패: '+e.message,true)}finally{$('refreshBtn').disabled=false}}
function showApp(){$('loginPage').classList.add('hidden');$('app').classList.remove('hidden');$('statusbar').classList.remove('hidden');$('roleText').textContent=session.role==='admin'?'관리자':'확인자';$('editHead').style.display=session.role==='admin'?'':'none';const d=new Date(),wd=['일','월','화','수','목','금','토'][d.getDay()];$('todayText').textContent=`오늘 ${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} (${wd})`}
function logout(){sessionStorage.removeItem('uwash_web_session');session=null;location.reload()}
function dayKey(y,m,d){return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function isToday(k){const d=new Date();return k===dayKey(d.getFullYear(),d.getMonth(),d.getDate())}
function renderMonth(){$('monthTitle').textContent=`${year}년 ${month+1}월`;const first=new Date(year,month,1).getDay(),count=new Date(year,month+1,0).getDate();let html='',mt=0,mc=0,mk=0;for(let i=0;i<42;i++){const d=i-first+1;if(d<1||d>count){html+='<button class="day empty" disabled></button>';continue}const k=dayKey(year,month,d),r=days[k],dow=new Date(k+'T00:00:00').getDay();let cls=(dow===0||dow===6?' weekend':'')+(HOLIDAYS.has(k)?' holiday':'')+(isToday(k)?' today':'');if(r){mt+=num(r.total_sales);mc+=num(r.cash_total);mk+=num(r.card_total);html+=`<button class="day has-data${cls}" data-date="${k}"><span class="n">${d}</span><div class="values"><span class="sales">매출 ${num(r.total_sales).toLocaleString()}</span><br>현금 ${num(r.cash_total).toLocaleString()}<br>카드 ${num(r.card_total).toLocaleString()}${num(r.pending_count)?`<br><span class="pending">미확인 ${num(r.pending_count)}건</span>`:''}</div></button>`}else html+=`<button class="day${cls}" disabled><span class="n">${d}</span></button>`}$('calendar').innerHTML=html;$('monthTotal').textContent=`월매출 ${mt.toLocaleString()}원  |  현금 ${mc.toLocaleString()}원  |  카드 ${mk.toLocaleString()}원`;document.querySelectorAll('.day[data-date]').forEach(x=>x.onclick=()=>showDetail(x.dataset.date))}
function showDetail(k){selected=k;const r=days[k];if(!r)return;const dt=new Date(k+'T00:00:00'),wd=['일','월','화','수','목','금','토'][dt.getDay()];$('detailTitle').textContent=`${k}(${wd}) 유워시 매출 내역`;$('detailTotal').textContent=won(r.total_sales);$('detailCash').textContent=won(r.cash_total);$('detailCard').textContent=won(r.card_total);$('unattended').textContent=won(r.unattended_cash);$('manualCash').textContent=won(r.manual_cash);$('manualAccount').textContent=won(r.manual_account);$('manualCard').textContent=won(r.manual_card);$('cardSales').textContent=won(r.card_sales);$('cardCount').textContent=num(r.card_count).toLocaleString()+'건';const list=manualByDate[k]||[];$('manualWrap').classList.toggle('hidden',list.length===0);const labels={pending:'미확인',record:'기록',ignore:'무시'};$('manualBody').innerHTML=list.map(x=>`<tr><td>${esc(x.event_time||'')}</td><td class="num">${won(x.charge_amount)}</td><td class="num">${x.sales_amount==null?'미입력':won(x.sales_amount)}</td><td>${esc(x.card_no||'')}</td><td>${esc(x.machine||'')}</td><td>${labels[x.decision]||esc(x.decision||'')}</td><td>${esc(x.payment_method||'')}</td><td>${esc(x.comment||'')}</td><td>${session?.role==='admin'?`<button class="edit-btn" data-key="${esc(x.transaction_key)}">수정</button>`:''}</td></tr>`).join('');document.querySelectorAll('.edit-btn').forEach(b=>b.onclick=()=>openManualEdit(b.dataset.key));$('monthView').classList.add('hidden');$('yearView').classList.add('hidden');$('detailView').classList.remove('hidden')}
function moveDay(delta){if(!selected)return;const d=new Date(selected+'T00:00:00');d.setDate(d.getDate()+delta);const k=dayKey(d.getFullYear(),d.getMonth(),d.getDate());if(days[k])showDetail(k)}
function renderYear(){$('yearTitle').textContent=`${annualYear}년 연매출`;let grand=0,cash=0,card=0,html='';const now=new Date();for(let m=1;m<=12;m++){const prefix=`${annualYear}-${String(m).padStart(2,'0')}-`;const rows=dailyRows.filter(r=>r.sale_date.startsWith(prefix));const mt=rows.reduce((a,r)=>a+num(r.total_sales),0),mc=rows.reduce((a,r)=>a+num(r.cash_total),0),mk=rows.reduce((a,r)=>a+num(r.card_total),0),pending=rows.reduce((a,r)=>a+num(r.pending_count),0);grand+=mt;cash+=mc;card+=mk;const cur=(annualYear===now.getFullYear()&&m===now.getMonth()+1)?' current':'';html+=`<button class="month-card${cur}" data-month="${m}"><div class="month">${m}월</div><div class="sales">매출 ${mt.toLocaleString()}원</div><div class="row">현금 ${mc.toLocaleString()}원</div><div class="row">카드 ${mk.toLocaleString()}원</div><div class="muted">집계일 ${rows.length}일${pending?` · 미확인 ${pending}건`:''}</div></button>`}$('yearGrid').innerHTML=html;$('yearTotal').textContent=`연매출 ${grand.toLocaleString()}원  |  현금 ${cash.toLocaleString()}원  |  카드 ${card.toLocaleString()}원`;document.querySelectorAll('.month-card').forEach(x=>x.onclick=()=>{year=annualYear;month=Number(x.dataset.month)-1;showMonthTab();renderMonth()})}
function showMonthTab(){$('monthTab').classList.add('active');$('yearTab').classList.remove('active');$('detailView').classList.add('hidden');$('yearView').classList.add('hidden');$('monthView').classList.remove('hidden')}
function showYearTab(){$('yearTab').classList.add('active');$('monthTab').classList.remove('active');$('detailView').classList.add('hidden');$('monthView').classList.add('hidden');$('yearView').classList.remove('hidden');renderYear()}
function boot(){$('email').value=localStorage.getItem('uwash_web_email')||'';try{session=JSON.parse(sessionStorage.getItem('uwash_web_session')||'null')}catch{session=null}if(session?.access_token&&session?.user_id&&session?.role){showApp();loadData()}setInterval(()=>{if(session&&Date.now()-lastLoadAt>60000)loadData()},60000);window.addEventListener('focus',()=>{if(session&&Date.now()-lastLoadAt>30000)loadData()})}
$('cancelEdit').onclick=closeManualEdit;$('saveEdit').onclick=saveManualEdit;$('editModal').onclick=e=>{if(e.target===$('editModal'))closeManualEdit()};
$('loginBtn').onclick=signIn;$('password').onkeydown=e=>{if(e.key==='Enter')signIn()};$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadData;$('monthTab').onclick=showMonthTab;$('yearTab').onclick=showYearTab;
$('prevMonth').onclick=()=>{month--;if(month<0){month=11;year--}renderMonth()};$('nextMonth').onclick=()=>{month++;if(month>11){month=0;year++}renderMonth()};$('thisMonth').onclick=()=>{const d=new Date();year=d.getFullYear();month=d.getMonth();renderMonth()};
$('backMonth').onclick=()=>{showMonthTab();renderMonth()};$('prevDay').onclick=()=>moveDay(-1);$('nextDay').onclick=()=>moveDay(1);
$('prevYear').onclick=()=>{annualYear--;renderYear()};$('nextYear').onclick=()=>{annualYear++;renderYear()};$('thisYear').onclick=()=>{annualYear=new Date().getFullYear();renderYear()};
boot();
</script>
</body></html>
